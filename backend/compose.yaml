services:
  server:
    build:
      context: .
    volumes:
      - ./uploads:/usr/src/app/uploads
    user: "1000:1000"
    environment:
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    ports:
      - 4000:4000